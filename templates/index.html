<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Contrôle de la voiture</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 0 0 16px; text-align: center; }
  h2 { font-size: 16px; margin: 0 0 10px; color: #ccc; }

  .layout {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .camera-box {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    background: #000;
    border: 2px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }
  .camera-box img {
    width: 100%;
    display: block;
  }

  .panel {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 14px;
  }

  .panels-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  /* Pavé directionnel */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    max-width: 320px;
    margin: 0 auto;
    aspect-ratio: 1 / 1;
  }
  .dpad button {
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #2e7d32;
    color: white;
    cursor: pointer;
    touch-action: none;
  }
  .dpad button:active { background: #1b5e20; transform: scale(0.96); }
  .dpad button.active { background: #1b5e20; }
  #btn-forward  { grid-column: 2; grid-row: 1; }
  #btn-left     { grid-column: 1; grid-row: 2; }
  #btn-stop     { grid-column: 2; grid-row: 2; background: #c62828; }
  #btn-stop:active { background: #8e0000; }
  #btn-right    { grid-column: 3; grid-row: 2; }
  #btn-backward { grid-column: 2; grid-row: 3; }

  #move-status {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
    color: #4caf50;
  }

  /* Assignation des touches */
  .bindings-list { display: flex; flex-direction: column; gap: 8px; }
  .binding-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #1e1e1e;
    border-radius: 8px;
    padding: 8px 12px;
  }
  .binding-key {
    font-family: monospace;
    background: #333;
    border-radius: 6px;
    padding: 4px 10px;
    min-width: 28px;
    text-align: center;
  }
  .binding-row button {
    background: #37474f;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .binding-row button.listening { background: #f9a825; color: #1e1e1e; }

  /* Configuration GPIO */
  .hint { font-size: 12px; color: #999; margin: 0 0 4px; line-height: 1.4; }
  .gpio-form { display: flex; flex-direction: column; gap: 10px; }
  .gpio-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .gpio-field label { font-size: 14px; color: #ddd; }
  .gpio-field-controls { display: flex; align-items: center; gap: 8px; }
  .gpio-field input {
    width: 90px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #1e1e1e;
    color: #fff;
    font-size: 15px;
  }
  .gpio-form .actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .gpio-form .actions button, .gpio-form .actions #gpio-save {
    background: #1565c0;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
  }
  .gpio-test {
    background: #00695c;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .gpio-test:disabled { opacity: 0.6; cursor: default; }
  #gpio-status { font-size: 13px; color: #aaa; }
  #gpio-status.ok { color: #4caf50; }
  #gpio-status.err { color: #f44336; }

  @media (min-width: 760px) {
    .panels-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

  <h1>Contrôle de la voiture</h1>

  <div class="layout">

    <div class="camera-box">
      <img src="{{ url_for('video_feed') }}" alt="Flux webcam">
    </div>

    <div class="panel">
      <h2>Déplacement</h2>
      <div class="dpad">
        <button id="btn-forward" data-action="forward">▲</button>
        <button id="btn-left" data-action="left">◀</button>
        <button id="btn-stop" data-action="stop">■</button>
        <button id="btn-right" data-action="right">▶</button>
        <button id="btn-backward" data-action="backward">▼</button>
      </div>
      <div id="move-status">Arrêté</div>
    </div>

    <div class="panels-grid">

      <div class="panel">
        <h2>Touches du clavier</h2>
        <div class="bindings-list" id="bindings-list"></div>
      </div>

      <div class="panel">
        <h2>Broches GPIO</h2>
        <div class="gpio-form">
          <div class="gpio-field">
            <label for="pin-right_forward">Droite avant</label>
            <div class="gpio-field-controls">
              <input type="number" id="pin-right_forward" min="0" max="27">
              <button type="button" class="gpio-test" data-key="right_forward">Tester</button>
            </div>
          </div>
          <div class="gpio-field">
            <label for="pin-right_backward">Droite arrière</label>
            <div class="gpio-field-controls">
              <input type="number" id="pin-right_backward" min="0" max="27">
              <button type="button" class="gpio-test" data-key="right_backward">Tester</button>
            </div>
          </div>
          <div class="gpio-field">
            <label for="pin-left_forward">Gauche avant</label>
            <div class="gpio-field-controls">
              <input type="number" id="pin-left_forward" min="0" max="27">
              <button type="button" class="gpio-test" data-key="left_forward">Tester</button>
            </div>
          </div>
          <div class="gpio-field">
            <label for="pin-left_backward">Gauche arrière</label>
            <div class="gpio-field-controls">
              <input type="number" id="pin-left_backward" min="0" max="27">
              <button type="button" class="gpio-test" data-key="left_backward">Tester</button>
            </div>
          </div>
          <p class="hint">« Tester » active seule la broche enregistrée pendant ~0,7s (utile pour vérifier le câblage). Enregistrez d'abord un changement de broche avant de le tester.</p>
          <div class="actions">
            <button id="gpio-save">Enregistrer</button>
            <span id="gpio-status"></span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // ------------------------------------------------------------------
    // Déplacement (boutons + clavier)
    // ------------------------------------------------------------------
    const moveStatus = document.getElementById('move-status');
    let currentAction = 'stop';

    async function sendMove(action) {
      currentAction = action;
      moveStatus.textContent = {
        forward: 'Avance', backward: 'Recule',
        left: 'Tourne à gauche', right: 'Tourne à droite', stop: 'Arrêté',
      }[action] || action;
      document.querySelectorAll('.dpad button').forEach(b => {
        b.classList.toggle('active', b.dataset.action === action && action !== 'stop');
      });
      try {
        await fetch(`/move/${action}`, { method: 'POST' });
      } catch (e) {
        console.error('Erreur de communication avec le serveur :', e);
      }
    }

    document.querySelectorAll('.dpad button[data-action]').forEach(btn => {
      const action = btn.dataset.action;
      const press = (e) => { e.preventDefault(); sendMove(action); };
      const release = (e) => { e.preventDefault(); if (action !== 'stop') sendMove('stop'); };
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      if (action === 'stop') {
        btn.addEventListener('click', () => sendMove('stop'));
      }
    });

    window.addEventListener('blur', () => sendMove('stop'));

    // ------------------------------------------------------------------
    // Assignation des touches du clavier aux actions
    // ------------------------------------------------------------------
    const ACTIONS = [
      { key: 'forward', label: 'Avancer' },
      { key: 'backward', label: 'Reculer' },
      { key: 'left', label: 'Tourner à gauche' },
      { key: 'right', label: 'Tourner à droite' },
    ];
    const DEFAULT_BINDINGS = { forward: 'z', backward: 's', left: 'q', right: 'd' };

    function loadBindings() {
      try {
        const saved = JSON.parse(localStorage.getItem('carKeyBindings'));
        if (saved) return { ...DEFAULT_BINDINGS, ...saved };
      } catch (e) { /* ignore */ }
      return { ...DEFAULT_BINDINGS };
    }

    let bindings = loadBindings();
    let listeningFor = null;
    const bindingsList = document.getElementById('bindings-list');

    function renderBindings() {
      bindingsList.innerHTML = '';
      ACTIONS.forEach(({ key, label }) => {
        const row = document.createElement('div');
        row.className = 'binding-row';

        const name = document.createElement('span');
        name.textContent = label;

        const keySpan = document.createElement('span');
        keySpan.className = 'binding-key';
        keySpan.textContent = (bindings[key] || '?').toUpperCase();

        const change = document.createElement('button');
        change.textContent = listeningFor === key ? 'Appuyez sur une touche…' : 'Modifier';
        change.classList.toggle('listening', listeningFor === key);
        change.addEventListener('click', () => {
          listeningFor = key;
          renderBindings();
        });

        row.append(name, keySpan, change);
        bindingsList.appendChild(row);
      });
    }
    renderBindings();

    function actionForKey(key) {
      const entry = Object.entries(bindings).find(([, k]) => k === key);
      return entry ? entry[0] : null;
    }

    const pressedActions = new Set();

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (listeningFor) {
        e.preventDefault();
        // Retire cette touche d'une éventuelle autre action pour éviter les doublons
        Object.keys(bindings).forEach(k => { if (bindings[k] === key) bindings[k] = ''; });
        bindings[listeningFor] = key;
        try { localStorage.setItem('carKeyBindings', JSON.stringify(bindings)); } catch (err) { /* ignore */ }
        listeningFor = null;
        renderBindings();
        return;
      }

      const action = actionForKey(key);
      if (!action || e.repeat) return;
      pressedActions.add(action);
      sendMove(action);
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      const action = actionForKey(key);
      if (!action) return;
      pressedActions.delete(action);
      if (pressedActions.size === 0) {
        sendMove('stop');
      } else {
        sendMove([...pressedActions][pressedActions.size - 1]);
      }
    });

    // ------------------------------------------------------------------
    // Configuration des broches GPIO
    // ------------------------------------------------------------------
    const gpioInputs = {
      right_forward: document.getElementById('pin-right_forward'),
      right_backward: document.getElementById('pin-right_backward'),
      left_forward: document.getElementById('pin-left_forward'),
      left_backward: document.getElementById('pin-left_backward'),
    };
    const gpioStatus = document.getElementById('gpio-status');

    async function loadGpioConfig() {
      try {
        const res = await fetch('/gpio/config');
        const data = await res.json();
        Object.entries(gpioInputs).forEach(([key, input]) => { input.value = data[key]; });
      } catch (e) {
        gpioStatus.textContent = 'Impossible de charger la configuration.';
        gpioStatus.className = 'err';
      }
    }
    loadGpioConfig();

    document.getElementById('gpio-save').addEventListener('click', async () => {
      const payload = {};
      Object.entries(gpioInputs).forEach(([key, input]) => { payload[key] = parseInt(input.value, 10); });

      if (Object.values(payload).some(v => Number.isNaN(v))) {
        gpioStatus.textContent = 'Merci de remplir toutes les broches.';
        gpioStatus.className = 'err';
        return;
      }

      try {
        const res = await fetch('/gpio/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          gpioStatus.textContent = 'Configuration enregistrée.';
          gpioStatus.className = 'ok';
        } else {
          gpioStatus.textContent = data.error || 'Erreur lors de l\'enregistrement.';
          gpioStatus.className = 'err';
        }
      } catch (e) {
        gpioStatus.textContent = 'Erreur de communication avec le serveur.';
        gpioStatus.className = 'err';
      }
    });

    document.querySelectorAll('.gpio-test').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        gpioStatus.textContent = `Test de la broche « ${btn.dataset.key} »…`;
        gpioStatus.className = '';
        try {
          const res = await fetch(`/gpio/test/${btn.dataset.key}`, { method: 'POST' });
          const data = await res.json();
          if (res.ok) {
            gpioStatus.textContent = 'Test terminé.';
            gpioStatus.className = 'ok';
          } else {
            gpioStatus.textContent = data.error || 'Erreur lors du test.';
            gpioStatus.className = 'err';
          }
        } catch (e) {
          gpioStatus.textContent = 'Erreur de communication avec le serveur.';
          gpioStatus.className = 'err';
        }
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
